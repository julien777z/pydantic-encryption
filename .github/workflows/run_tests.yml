name: Run Tests via Pytest

on:
  push:
    branches:
      - main
    paths:
      - "pydantic_encryption/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/run_tests.yml"
      - ".github/actions/setup-python-poetry/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "pydantic_encryption/**"
      - "tests/**"
      - "scripts/**"
      - "pyproject.toml"
      - "poetry.lock"
      - ".github/workflows/run_tests.yml"
      - ".github/actions/setup-python-poetry/**"

jobs:
  build:
    name: Build and Run Tests
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Python and Poetry
        uses: ./.github/actions/setup-python-poetry
        with:
          python-version: ${{ matrix.python-version }}
          post_setup_command: "poetry install --all-extras"

      - name: Test with Pytest
        run: |
          poetry run pytest --cov=pydantic_encryption --cov-branch --cov-report=xml
        env:
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          ENCRYPTION_METHOD: "fernet"
          BLIND_INDEX_SECRET_KEY: "test-blind-index-secret-key"

      - name: Set Up Python for Codecov
        uses: actions/setup-python@v7
        with:
          # Codecov's PyPI parser uses PyO3 0.27.1, which supports Python through 3.14.
          python-version: "3.14"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_pypi: true
          files: coverage.xml
          disable_search: true
          plugins: noop
          fail_ci_if_error: true
